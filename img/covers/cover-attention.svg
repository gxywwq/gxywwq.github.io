<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12233a"/>
      <stop offset="1" stop-color="#30a9de"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="url(#bg)"/>
  <!-- 同心圆：模拟注意力聚焦 -->
  <g transform="translate(470 118)">
    <circle r="112" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
    <circle r="84" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    <circle r="56" fill="none" stroke="#ffffff" stroke-opacity="0.20" stroke-width="3"/>
    <circle r="30" fill="#ffffff" fill-opacity="0.12"/>
  </g>
  <circle cx="70" cy="300" r="150" fill="#0b1b2a" opacity="0.20"/>
</svg>
